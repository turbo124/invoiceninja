on:
  push:
    branches:
      - v5-develop
      - v5-stable
  pull_request:
    branches:
      - v5-develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
name: phpunit
jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: read
      
    strategy:
      matrix:
        operating-system: ['ubuntu-26.04']
        php-versions: ['8.3','8.4','8.5']
        phpunit-versions: ['latest']
        ci_node_total: [ 8 ]
        ci_node_index: [ 0, 1, 2, 3, 4, 5, 6, 7]
        dependency-version: [prefer-stable]

    env:
      DB_CONNECTION: mysql
      DB_DATABASE1: ninja
      DB_USERNAME1: root
      DB_PASSWORD1: ninja
      DB_HOST1: '127.0.0.1'
      DB_DATABASE: ninja
      DB_USERNAME: root
      DB_PASSWORD: ninja
      DB_HOST: '127.0.0.1'
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      NINJA_ENVIRONMENT: hosted
      MULTI_DB_ENABLED: false
      NINJA_LICENSE: ${{ secrets.ninja_license }}
      TRAVIS: true
      MAIL_MAILER: log
      PDF_GENERATOR: simulator
      PDF_GENERATOR_REAL: snappdf
      SENTRY_SAMPLE_RATE: 0
      
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 32768:3306
        env:
          MYSQL_USER: ninja
          MYSQL_PASSWORD: ninja
          MYSQL_DATABASE: ninja
          MYSQL_ROOT_PASSWORD: ninja
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis
        ports:
          - 6379/tcp
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Add hosts to /etc/hosts
      run: |
        sudo echo "127.0.0.1 ninja.test" | sudo tee -a /etc/hosts

    - name: Setup PHP shivammathur/setup-php@v2
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mysql, mysqlnd, sqlite3, bcmath, gmp, gd, curl, zip, openssl, mbstring, xml, redis, :psr
        tools: composer:v2

    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Copy .env
      run: |
        cp .env.ci .env

    - name: Configure CI service ports
      run: |
        echo "REDIS_PORT=${{ job.services.redis.ports['6379'] }}" >> "$GITHUB_ENV"
        echo "DB_PORT=${{ job.services.mariadb.ports[3306] }}" >> "$GITHUB_ENV"
        echo "DB_PORT1=${{ job.services.mariadb.ports[3306] }}" >> "$GITHUB_ENV"

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.php-versions }}-composer-

    - name: Install composer dependencies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export COMPOSER_AUTH=$(php -r 'echo json_encode([
          "github-oauth" => [
            "github.com" => getenv("GH_TOKEN")
          ]
        ]);')

        composer install --no-interaction --prefer-dist

    - name: Prepare Laravel Application
      run: |
        php artisan key:generate
        php artisan config:clear
        php artisan ninja:post-update
        php artisan optimize:clear
        
    - name: Migrate Database
      run: |
        php artisan migrate && php artisan db:seed
  
    - name: Restore test timings
      uses: actions/cache/restore@v6
      with:
        path: tests/_output/ci-timings
        key: ci-timings-${{ github.run_id }}
        restore-keys: |
          ci-timings-

    - name: Cache Snappdf Chromium
      uses: actions/cache@v6
      with:
        path: vendor/beganovich/snappdf/versions
        key: snappdf-chromium-v1-${{ runner.os }}

    - name: Run Testsuite
      run: |
        cat .env
        vendor/bin/snappdf download
        tests/ci
      # Snappdf is for tests that opt into PDF_GENERATOR_REAL (see UsesRealPdfGeneration).
      env:
        PHP_CS_FIXER_IGNORE_ENV: true
        CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
        CI_NODE_INDEX: ${{ matrix.ci_node_index }}
        # Job env wins over phpunit.xml; match .env.testing so tests do not require Redis.
        QUEUE_CONNECTION: sync
        CACHE_DRIVER: array
        SESSION_DRIVER: array

    - name: Upload JUnit timings
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: junit-${{ matrix.php-versions }}-${{ matrix.ci_node_index }}
        path: tests/_output/junit.xml
        if-no-files-found: ignore
        retention-days: 1

  timings:
    name: update test timings
    needs: run
    if: github.event_name == 'push' && github.ref == 'refs/heads/v5-develop' && needs.run.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Download JUnit timings
      uses: actions/download-artifact@v6
      with:
        pattern: junit-*
        path: junit

    - name: Merge timings
      run: tests/ci-merge-timings junit tests/_output/ci-timings/timings.json

    - name: Save test timings
      uses: actions/cache/save@v6
      with:
        path: tests/_output/ci-timings
        key: ci-timings-${{ github.run_id }}
